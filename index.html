<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiction 11 - Login</title>
<style>
  body { background: #1a3c6e; color: white; font-family: Arial; text-align: center; padding-top: 100px; }
  .box { background: #2a4f8a; padding: 30px; border-radius: 15px; width: 300px; margin: auto; }
  input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; }
  button { background: #ff5722; color: white; border: none; padding: 12px 30px; border-radius: 10px; font-size: 16px; cursor: pointer; margin: 5px; }
  h1 { color: #ffeb3b; }
</style>
</head>
<body>

  <h1>⚡ Fiction 11 ⚡</h1>
  <div class="box">
    <h2>Welcome Back</h2>
    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    <br>
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

<script>
function login() {
  let user = document.getElementById("username").value;
  if(user == "") { alert("Enter Username"); return; }
  localStorage.setItem("user", user);
  window.location.href = "game.html";
}

function signup() {
  alert("Sign Up Successful!");
  login();
}
</script>

</body>
</html>

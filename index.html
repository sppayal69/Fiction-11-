<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiction 11 - Fantasy Sports</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icon Link for Question Mark -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- 1. Splash Screen Section (Shows initially for 3 seconds) -->
    <div id="splash-screen">
        <div class="splash-logo">F</div>
        <div class="splash-footer">
            <span>from</span>
            <h3>FICTION SPORTS</h3>
        </div>
    </div>

    <!-- 2. Main Login Page Section -->
    <div id="login-container" style="display: none;">
        
        <!-- Top Help Question Mark Button -->
        <div class="top-nav">
            <button class="help-btn" onclick="alert('For assistance, contact support@fiction11.com')">
                <i class="fa-regular fa-circle-question"></i>
            </button>
        </div>

        <!-- Brand Logo and Name -->
        <div class="brand-section">
            <div class="main-logo">F</div>
            <h1 class="brand-name">FICTION<span>11</span></h1>
        </div>

        <!-- Auth Box (Input Form) -->
        <div class="auth-box">
            <form id="login-form">
                <div class="input-container">
                    <input type="text" id="user-input" placeholder="Enter email or mobile number" required>
                </div>
                <button type="submit" id="continue-btn" disabled>CONTINUE <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <div class="divider"><span>Or</span></div>

            <!-- Google Login Button (100% Live & Working Logo URL) -->
            <button id="google-btn">
                <img src="https://gstatic.com" alt="Google Logo">
                <span>Continue with Google</span>
            </button>
            
            <p id="msg-box"></p>
        </div>

        <!-- Stadium Background Design -->
        <div class="stadium-bg">
            <div class="stadium-lights"></div>
            <div class="stadium-stand">
                <div class="banner-text">FICTION 11 ★ FICTION 11 ★ FICTION 11</div>
            </div>
            <div class="stadium-ground"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>

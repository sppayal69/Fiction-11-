<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FICTION 11 - Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');
  body {
    margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
    background: #0a0a0a url('https://i.imgur.com/8QK2z9L.jpg') no-repeat center bottom;
    background-size: cover; color: white; height: 100vh;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top-right { text-align: right; padding: 20px; font-size: 24px; }
  .top-right a { color: white; text-decoration: none; }
  .login-box { padding: 20px; text-align: center; }
  .logo { font-size: 38px; font-weight: 700; margin-bottom: 40px; color: #ff1744; text-shadow: 0 0 10px rgba(255, 23, 68, 0.5); }
  input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #1e1e1e; color: white; font-size: 16px; }
  input::placeholder { color: #888; }
  .btn-continue { width: 95%; padding: 15px; border-radius: 12px; border: none; background: #555; color: #999; font-size: 18px; font-weight: 700; margin-top: 10px; }
  .or { margin: 25px 0; font-size: 14px; color: #aaa; }
  .btn-google { width: 95%; padding: 15px; border-radius: 12px; border: 1px solid white; background: transparent; color: white; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn-google img { width: 20px; }
</style>
</head>
<body>

<div class="top-right"><a href="#">?</a></div>

<div class="login-box">
  <div class="logo"><span>🏆</span> FICTION 11</div>
  <input type="email" placeholder="Enter email or phone">
  <button class="btn-continue">CONTINUE →</button>
  <div class="or">---------- Or ----------</div>
  <button class="btn-google" onclick="window.location.href='game.html'">
    <img src="https://www.google.com/favicon.ico"> Continue with Google
  </button>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiction 11 - Fantasy Cricket</title>
<style>
  body { 
    background: #f5f5f5; 
    color: #333; 
    font-family: 'Arial', sans-serif; 
    padding: 15px; 
    margin: 0;
  }
  .header {
    background: linear-gradient(90deg, #1e3c72, #2a5298);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  h1 { 
    color: #ffeb3b; 
    font-size: 32px;
    margin: 0;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }
  .subtitle { color: white; margin: 5px 0 0 0; font-size: 14px; }
  #credit { color: #4caf50; font-weight: bold; font-size: 18px; }
  #wallet { 
    background: white; padding: 15px; border-radius: 12px; 
    text-align: center; margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 2px solid #ff9800;
  }
  #myTeam { 
    background: white; padding: 15px; border-radius: 12px; 
    margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .game-card { 
    background: white; padding: 15px; margin: 10px 0; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 5px solid #2a5298;
  }
  button { 
    background: #ff5722; color: white; border: none; padding: 12px; 
    border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px;
    font-weight: bold; font-size: 16px;
  }
  .join-btn { background: linear-gradient(90deg, #4caf50, #2e7d32); font-size: 18px; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ FICTION 11 ⚡</h1>
  <p class="subtitle">Play Fantasy • Win Real Trophy</p>
</div>

<div id="wallet">Wallet Balance: <span id="balance">0</span> Taka <button onclick="addMoney()">+ Add Money</button></div>
<div id="games"></div>

<script>
const bplPlayers = [
  {name: "Tamim Iqbal", team: "Barishal", role: "Batter", credit: 9},
  {name: "Shakib Al Hasan", team: "Barishal", role: "All-rounder", credit: 10},
  {name: "Litton Das", team: "Cumilla", role: "WK-Batter", credit: 9},
  {name: "Mustafizur Rahman", team: "Cumilla", role: "Bowler", credit: 8.5},
  {name: "Taskin Ahmed", team: "Dhaka", role: "Bowler", credit: 9},
  {name: "Mahmudullah", team: "Dhaka", role: "All-rounder", credit: 8},
  {name: "Soumya Sarkar", team: "Rangpur", role: "Batter", credit: 7.5}
];

let myBPLTeam = [];
let totalCredit = 100;
let walletBalance = localStorage.getItem("wallet") || 0;
document.getElementById("balance").innerText = walletBalance;

function addMoney() {
  let amount = prompt("Enter amount to add:");
  walletBalance = parseInt(walletBalance) + parseInt(amount);
  localStorage.setItem("wallet", walletBalance);
  document.getElementById("balance").innerText = walletBalance;
  alert(amount + " Taka added to wallet!");
}

function showBPLPlayers() {
  let html = `<h2>🏆 BPL 2026 - Build Team - 100 Credits</h2>`;
  html += `<p>Credits Left: <span id="credit">${totalCredit}</span></p>`;
  html += `<div id="myTeam"><h3>My Team: ${myBPLTeam.length}/7</h3><ul id="teamList"></ul></div>`;

  bplPlayers.forEach((p, i) => {
    html += `<div class="game-card">
      <h3>${p.name}</h3>
      <p>Team: ${p.team} | Role: ${p.role}</p>
      <p>Credit: ${p.credit}</p>
      <button onclick="addBPLPlayer(${i})">Add to Team</button>
    </div>`;
  });
  
  html += `<button class="join-btn" onclick="joinContest()">Join Contest - 20 Taka</button>`;
  document.getElementById("games").innerHTML = html;
  updateTeamList();
}

function addBPLPlayer(i) {
  let player = bplPlayers[i];
  if(myBPLTeam.length < 7 && totalCredit >= player.credit) {
    myBPLTeam.push(player);
    totalCredit = totalCredit - player.credit;
    document.getElementById("credit").innerText = totalCredit.toFixed(1);
    updateTeamList();
  } else if(myBPLTeam.length >= 7) {
    alert("You already selected 7 players!");
  } else {
    alert("Not enough credits!");
  }
}

function updateTeamList() {
  let list = document.getElementById("teamList");
  list.innerHTML = "";
  myBPLTeam.forEach(p => {
    list.innerHTML += `<li>${p.name} - ${p.credit} cr</li>`;
  });
}

function joinContest() {
  if(myBPLTeam.length < 7) {
    alert("Please select 7 players first");
    return;
  }
  if(walletBalance < 20) {
    alert("Not enough balance! Please add money");
    return;
  }
  walletBalance = walletBalance - 20;
  localStorage.setItem("wallet", walletBalance);
  document.getElementById("balance").innerText = walletBalance;
  alert("Contest joined! 20 Taka deducted.\nGood Luck!");
}

showBPLPlayers();
</script>
</body>
</html>
